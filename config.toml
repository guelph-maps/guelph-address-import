[city]
slug = "guelph"
name = "Guelph"
# "Guelph Areas": 23 community-area polygons on the city's self-hosted open
# data server (the neighbourhood-fabric analogue of Toronto's 158 / Hamilton's
# 234). Probed 2026-08-15 per 04-city-onboarding.md: point-test coverage
# 99.47% of snapshot-39 addresses (287 orphans — 213 city edge cases plus 74
# of the 75 'Guelph/Eramosa Twp' rows, which lie outside the city fabric by
# construction). Name field is AREA_NAME (unique across all 23, no parent
# prefix needed; first entry in the tile builder's sniff list); CSDNAME is the
# constant 'Guelph'. 23 features fit one page under maxRecordCount = 1000.
# The Hub search also surfaced Wards (6 polygons — too coarse) and
# CityBoundary (OpenData1/3, 1 polygon — the future 10-boundary-clipping.md
# input, noted here so it isn't re-discovered).
neighbourhoods_url = "https://gismaps.guelph.ca/hosting/rest/services/OpenData/OpenData2/FeatureServer/17/query?where=1%3D1&outFields=AREA_NAME,CSDNAME&outSR=4326&f=geojson"
# Declared 2026-08-15 (engine contract change, 02-city-config-contract.md,
# same day as the scaffold): field verified by the onboarding probe.
neighbourhood_name_field = "AREA_NAME"

[source]
sqlite_path = "C:/Users/kk/Code/ontario-address-changes/data/guelph/guelph.db"

# Per-city projection recipe (multi-city Tier 2), measured against snapshot 39
# (2026-08-13, 53,846 active rows, all STATUS='Active').
[source_fields]
# FULLNAME is the tracker's canonical street: 100% typed and already OSM long
# form ("Cork Street West"), so expand_street_name() is a no-op here.
street_from = "street"
# NOT "full": Guelph's ADDRESS column appends the unit ("12-100 Main St"),
# which inflated the survey's first distinct count 40,634 -> 53,706 (the trap
# documented in 08-survey-results-2026-08-12.md). Synthesize instead.
full_from = "number+street"
# PLACE is 'Guelph' on 53,771 rows and 'Guelph/Eramosa Twp' on 75 — the one
# subdivision the city layer publishes past its own boundary (NE corner;
# Wellington's dataset carries the same 73-75 addresses, the only genuine
# source overlap found by the census). Nearly constant, so unlike Hamilton's
# COMMUNITY it adds nothing to dedup keying — declared for review display and
# so the township rows stay distinguishable. They are NOT routed to Wellington:
# compared row-by-row 2026-08-31 (ERAMOSA_OVERLAP.md), the two sources agree on
# all 73 addresses they share, the County does not publish 664 Woodlawn Road
# East at all, and 73 of the 75 were already imported from this source in 2025
# (changeset 172765115). They stay city-sourced.
municipality = "props:PLACE"
# Integer 1-6, populated on 53,771 rows (99.86%) — empty exactly on the 75
# township rows. First city to declare ward since Toronto (whose WARD_NAME is
# a string; watch how the run UI formats an int).
ward = "props:WARD"
# Tracker canonical column (source UNIT_NO), populated on 13,162 rows (24.4%).
# Declaring it obliges the [units] policy below. (The props HAS_UNIT flag
# disagrees with the unit column on ~277 rows; the column is authoritative.)
unit = "unit"
# STATUS is 'Active' on all 53,846 snapshot-39 rows. Declared same-day with
# the engine's status capability (retrofit, 2026-08-15): a no-op today, but
# if Guelph ever publishes Proposed/Pending rows they are filtered, not
# imported.
status = "props:STATUS"
# Absent, verified against snapshot-39 props (19 keys, 2026-08-15): no
# lo_num/hi_num ranges, no address_class. suffix_range therefore stays
# undeclared below — the engine would refuse a config that enables it.

# Same decision as Hamilton (09-units.md option 2): collapse to one candidate
# per civic address, defer unit-level import. Measured 2026-08-15 on snapshot
# 39: 53,846 rows -> 40,634 civic groups keyed on (number, street, PLACE);
# 514 groups are stacked (deepest 214 units), 80 of those have no unit-less
# row to elect (lowest identity_key then). 111 groups carry >1 unit-less rows
# — civic-level intra-source duplicates worth a look during review.
#
# COLLAPSE VS PER-DOOR NODES — the rule (2026-09-15). Superseded two earlier
# readings of this, both of which classified on geometry and both of which were
# wrong. Geometry is the guard; the UNIT NUMBERING is what decides.
#
# The City has no building or structure field, and PIN is single on 460 of the
# 514 (a condo complex is one parcel), so neither answers it. The numbering
# does: a suite number encodes the floor or building it sits in, a door number
# does not. Strip the last two digits — if what remains takes two or more
# values, the scheme is floor- or building-coded and the units are stacked:
#   93 Arthur Street South    101..1411, prefixes 1-14  -> 14 storeys
#   150 Wellington Street E   101..1802, prefixes 1-18  -> 18 storeys
#   71 Bayberry Drive         D101..D409                -> building D
#   302 College Avenue West   1..214, no prefix          -> 214 doors
# Catching 3- and 4-digit codes and letter prefixes in one rule matters: a
# 3-digit-only test lets 93 Arthur Street South through as 193 "doors" packed
# into 66 m, and a spacing-only test lets it through too.
#
# Spacing then guards the sequential ones, against a townhouse's minimum
# buildable width of ~4.5 m. Under 2 m there is no distinct location to map at
# all; 2-4.5 m is real enough to be a point but too tight to be a front door.
#
# The whole of the 514, and all 13,160 unit rows — run through the shipped
# t2/units.py on snapshot 46, keyed the way the engine keys (number, street,
# municipality) rather than the way the exploratory scripts did:
#    87 groups  5,093 units  COLLAPSE — floor/building-coded suites
#    22 groups    575 units  COLLAPSE — no distinct per-unit location (<2 m)
#   240 groups  6,111 units  NODES    — sequential, door-width spacing
#    58 groups  1,381 units  REVIEW   — sequential but under 4.5 m apart
#   107 groups      0 units  civic duplicates, no unit rows — these are the
#                            ~111 intra-source duplicates noted above, not a
#                            unit question at all.
# So 349 of 407 unit-bearing groups decide themselves and 58 need eyes — about
# one in seven. REVIEW is where the genuinely hard cases sit: 252 Stone Road
# West is a mall whose 140 "units" are storefronts, and whether a storefront is
# a door is a judgement no rule should be making silently. Those groups are
# emitted COLLAPSED, not held back — collapsing is right either way, and the
# reviewer sees one node to weigh instead of 140 to reject.
#
# One known blind spot, caught by the spacing guard rather than the rule:
# 2-digit floor codes (49 Surrey Street East runs 11;21-22;31-32 — floor 1
# unit 1, floor 2 unit 1) are too short to carry a stem, so _stem returns None
# and is_coded says no. Every instance found so far is also coincident, so the
# <2 m branch collapses it anyway. If one ever turns up spread out it will read
# as doors.
#
# NOT the same 87/89 as the OSM-hyphenated 89 below. Different sets, same size
# by coincidence.
# Where the 514 actually stand against OSM:
#   304  already carry a bare civic node — MATCH, nothing to decide.
#    89  OSM has ONLY the double-encoded form (714-30), so conflate.py's
#        exact-string _norm_number (conflate.py:168) reads them as MISSING.
#        These 89 are the whole interaction between gap-fill and mechanical
#        edit #2: whichever runs first changes what the other sees. Not yet
#        written into IMPORT_PROPOSAL.mediawiki — open decision.
#   121  absent in any form — ordinary gap-fill, one civic node each.
# City-wide the same exact-string effect is small: of 2,598 civic keys with no
# bare OSM match, only 91 are rescued by the hyphenated form; 2,507 are really
# absent, which corroborates the 2,523 hand-measured on 2026-08-10.
# Strongest per-door signal, if per-door nodes are ever wanted: unit_count ==
# distinct PIN count (freehold townhouses, separate parcels sharing a civic
# number) — 34 groups, 11 of them in the 121 absent-entirely bucket.
#
# DECIDED 2026-09-15, BUILT THE SAME DAY. Door units become their own nodes;
# big apartments collapse to one civic node with the units listed on it. The
# City's data is already in that shape, so this reads its geometry rather than
# overriding it, and conflation is told about units rather than left comparing
# bare housenumbers. Guelph-specific: an opt-in policy value, NOT a change to
# what collapse-to-civic means — Toronto and Hamilton keep the old behaviour,
# and every query, match and dedup path gates on this value so they stay
# byte-identical.
#
# Sequencing, decided with it and then made moot: mechanical edit #2 (split the
# double-encoded 714-30) was to run BEFORE any conflation. Unit-aware matching
# removed the need — a node split into 714 + addr:unit=30 still is not the
# building, so the civic candidate is proposed either way and the order no
# longer matters. The range caveat is retired too: once the double-encoding is
# gone, a hyphen left in an OSM housenumber is a genuine address range.
#
# The engine side, all landed 2026-09-15 in address-importer-friend:
#   t2/units.py               the classifier and the addr:flats renderer
#   t2/candidates.py          per-group emission, city-wide group fetch,
#                             per-emission tile clipping
#   t2/source_db.py           build_civic_group_query, PER_DOOR
#   t2/conflate.py            _same_address, gated on this policy
#   t2/osm_export.py          addr:unit / addr:flats, unit-aware upload dedup
#   migrations/017_unit_flats.sql
#
# STILL OPEN, and deliberately not built: the maintenance path. A new unit
# appearing at an already-collapsed tower needs addr:flats *modified* on an
# existing node, and the import is create-only — iter_new_since would ingest
# the unit row and propose a second node for the building. Route those to a QA
# finding instead. iter_retired_since has the mirror problem: a retired unit
# should shrink a listing, and nothing shrinks it. Until that is closed, run
# per-door-or-collapse from the tile path only, not the monthly maintenance job.
#
# The collapsed apartment node carries addr:flats, as semicolon-separated
# ranges broken wherever the numbering skips (decided 2026-09-15). Guelph's
# tower units are floor-coded, so a single range would be a lie: 19 Woodlawn
# Road East runs 101..915 but holds 142 units, and only 2 of 46 all-numeric
# towers are contiguous. Per-floor ranges are both honest and compact —
#   23 Woodlawn Road East (103 units):
#     101-110;201-212;301-312;401-412;501-512;601-612;701-705;707-712;
#     801-812;901-909;911
# where 701-705;707-712 and 901-909;911 are real gaps, not tidying. Letter
# prefixes are building letters and group on their own (71 Bayberry Drive ->
# D101-D112;D201-D212;D301-D312;D401-D409); letter-suffixed strays (101A,
# 102B) cannot join a range and are emitted as single values.
# Verified over all 54 coincident groups, 2026-09-15: every one compresses,
# median 31 chars, max 135 — comfortably inside OSM's 255-char tag value
# limit, which a raw list of 142 values would have blown.
# Known cosmetic wrinkle: strays sort to the tail, so 511 Edinburgh Road South
# reads 101-102;201-202;101A rather than interleaving 101A after 101.
#
# addr:flats is the right key because it means containment — this node SERVES
# these units — where addr:unit means identity, this node IS that unit. Door
# nodes therefore take addr:unit, collapsed apartments take addr:flats; they
# are not two spellings of one idea. Caveat carried knowingly: Ontario has 58
# addr:flats against 29,312 addr:unit (counted 2026-09-15 against area
# 3600068841), so this is close to a regional first and should be called out
# on thread #135103 rather than slipped in.
#
# This also reverses a PUBLISHED non-goal — "No unit-level addresses uploaded"
# on Guelph/Address_Import/Continuous, and the matching line in the scope
# table. The wiki page and forum thread #135103 need that before any upload
# under this policy, and ARandomThumbtack holds a standing veto over it.
[units]
policy = "per-door-or-collapse"

[status]
active_values = ["Active"]

# Operator-facing chrome — where the tool's header and footer point for Guelph.
# Omitted keys are simply not shown (before 2026-08-29 every city was shown
# Toronto's repo, thread and licence). No `open_data` here: Guelph's licence is
# the Open Government Licence - City of Guelph, but no canonical URL for it is
# recorded anywhere in the family, so the footer falls back to the [export]
# attribution string unlinked rather than to a guessed link.
[links]
repo = "https://github.com/guelph-maps/guelph-address-import"
# The announcement thread, #135103, opened 2026-08-27.
discussion = "https://community.openstreetmap.org/t/import-addresses-from-city-of-guelph-data/135103"
# Our wiki page — the same one [export] import_plan stamps on every changeset.
# Deliberately NOT the prior import's page, which belongs to its author.
proposal = "https://wiki.openstreetmap.org/wiki/Guelph/Address_Import/Continuous"

[run_defaults]
# Small downtown rectangle (around St. George's Square) for first test runs.
bbox = [43.538, -80.256, 43.550, -80.244]
overpass_url = "https://overpass-api.de/api/interpreter"

[osm]
source = "local"
# Same Ontario PBF as every city in the portfolio.
pbf_url = "https://download.geofabrik.de/north-america/canada/ontario-latest.osm.pbf"
# Source-data extent (53,846 rows measured 2026-08-15: lat 43.4748..43.58629,
# lon -80.32545..-80.15481) plus a small margin. Guelph is a separated city
# wholly inside Wellington County — the rectangle inevitably catches township
# addresses in the corners (7,818 OSM-side extras in the 2026-08-10 survey
# were mostly this); see 10-boundary-clipping.md, and the CityBoundary layer
# noted under [city] above.
city_bbox = [43.46, -80.34, 43.60, -80.14]
extract_dir = "data/osm"

[conflation]
match_radius_m = 100
match_near_m = 15

[checks]
match_far = true
# suffix_range deliberately absent: it reads lo_num/hi_num, which Guelph's
# source does not have ([source_fields] declares none).
city_duplicate = true
missing_sample = true
nearby_street_mismatch = true

[check_params.city_duplicate]
radius_m = 3.0

[check_params.missing_sample]
every_nth = 50

[check_params.nearby_street_mismatch]
radius_m = 20.0

[check_params.match_number_drift]
slack_m = 2.0

[upload]
changesets_per_minute = 1
changeset_comment_template = "{city} Open Data address import, run={run_name}"

[export]
# Verbatim the 2025 import's string (their changesets carry
# source=Guelph Open Data), NOT the "City of ..." form Toronto uses. One city,
# one attribution value: a reader filtering Guelph's address provenance should
# get one answer, not two spellings of it. The *key* deliberately does not
# match theirs — the engine writes addr:source on nodes and source on the
# changeset; see the wiki page's tagging plan for why.
attribution = "Guelph Open Data"
# Our page, published 2026-08-27 and confirmed live before this was set — the
# engine stamps this on every changeset, so it must never point at a page that
# does not exist. Deliberately NOT the prior import's page
# (Guelph/Address_Import): that belongs to its author, is linked from ours, and
# is never edited or reused. Source of truth is IMPORT_PROPOSAL.mediawiki in
# this repo; edit there and re-publish, don't diverge the wiki from it.
import_plan = "https://wiki.openstreetmap.org/wiki/Guelph/Address_Import/Continuous"
# Constant tags on every node we create. The published tagging plan promises
# addr:city=Guelph, which is where Guelph departs from the Toronto baseline
# (Toronto deliberately writes none). addr:province stays absent — the plan
# omits it per Canadian convention, and campaign (a) removes the ~3,699 the
# 2025 import left behind.
node_tags = { "addr:city" = "Guelph" }
# The changeset names the licence the source data comes under. Promised by the
# plan's changeset-tag table; Toronto's table has no such key.
source_license = "OGL-Canada-2.0"

# The prior import's tag mapping (05-prior-import-detection.md, "What to
# capture in config"). NOT read by the engine yet — the [prior_import]
# contract is proposed, not implemented — kept here as the load-bearing record
# anything we upload must stay consistent with. Established 2026-08-10 from
# changeset 173187168 and the wiki page.
[prior_import]
importer = "ARandomThumbtack_Import"
wiki_page = "https://wiki.openstreetmap.org/wiki/Guelph/Address_Import"
declared_complete = "2025-10-23"
source_name = "Guelph Open Data"
source_license = "OGL-Canada-2.0"
# Source field -> OSM tag, as the prior import wrote them. addr:province was
# added as a constant "Ontario".
tag_mapping = { STREETNO = "addr:housenumber", FULLNAME = "addr:street", PLACE = "addr:city", POSTCODE = "addr:postcode", UNIT_NO = "addr:unit" }
